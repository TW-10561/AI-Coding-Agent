# ── Thirdwave Platform — Docker Compose ────────────────────────────────
#
# Quick start:
#   cd platform/docker
#   VLLM_BASE_URL=http://your-gpu:8000/v1 docker compose up --build
#
# Or with a .env file:
#   cp ../../platform/.env.example .env   (edit .env)
#   docker compose up --build
#
# Connect TUI to running container:
#   thirdwave --tui-only   (or: THIRDWAVE_URL=http://host:3100 bun run tui/src/main.ts)

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: thirdwave-postgres
    environment:
      POSTGRES_DB: thirdwave
      POSTGRES_USER: ${POSTGRES_USER:-thirdwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thirdwave_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../src/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../src/config/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thirdwave}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── PgBouncer ───────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: thirdwave-pgbouncer
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thirdwave}:${POSTGRES_PASSWORD:-thirdwave_secret}@postgres:5432/thirdwave
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 30
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Platform ────────────────────────────────────────────────────────
  platform:
    build:
      context: ../..
      dockerfile: platform/docker/Dockerfile
    container_name: thirdwave
    ports:
      - "${PORT:-3100}:3100"
      - "${OPENCODE_PORT:-4096}:4096"
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"
      OPENCODE_URL: "http://127.0.0.1:4096"
      OPENCODE_BIN: "opencode"
      OPENCODE_DIR: "/workspace"
      NODE_ENV: "${NODE_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      VLLM_BASE_URL: "${VLLM_BASE_URL:-http://172.30.140.91:8000/v1}"
      VLLM_API_KEY: "${VLLM_API_KEY:-vllm-qgDSWPGLwcjvq63ApWIiU0sgiKiF5E5nqvGaAcKfh8Q}"
      VLLM_MODEL_ID: "${VLLM_MODEL_ID:-plezan/MiniMax-M2.1-REAP-50-W4A16}"
      VLLM_MODEL_NAME: "${VLLM_MODEL_NAME:-MiniMax M2.1 REAP 50 W4A16}"
      VLLM_CONTEXT_LIMIT: "${VLLM_CONTEXT_LIMIT:-30000}"
      VLLM_OUTPUT_LIMIT: "${VLLM_OUTPUT_LIMIT:-4096}"
      PLATFORM_API_KEY: "${PLATFORM_API_KEY:-}"
      # PostgreSQL — use PgBouncer for connection pooling
      POSTGRES_URL: "postgresql://${POSTGRES_USER:-thirdwave}:${POSTGRES_PASSWORD:-thirdwave_secret}@pgbouncer:5432/thirdwave"
      JWT_SECRET: "${JWT_SECRET:-}"
    volumes:
      - ${PROJECT_DIR:-.}:/workspace:rw
      - opencode-state:/root/.local/share/opencode
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 40s

volumes:
  opencode-state:
  pgdata:
