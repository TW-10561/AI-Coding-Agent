# ── Artemis AI Platform — Nginx Reverse Proxy ────────────────────────
#
# Install:
#   sudo cp platform/deploy/nginx/artemis.conf /etc/nginx/sites-available/artemis
#   sudo ln -sf /etc/nginx/sites-available/artemis /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or run:
#   sudo bash platform/deploy/deploy.sh
#
# Access:
#   http://<server-ip>/            → Artemis dashboard
#   http://<server-ip>/api/...     → REST API
#   http://<server-ip>/health      → Health check
#
# For HTTPS (production):
#   1. Set server_name to your domain
#   2. Use certbot: sudo certbot --nginx -d your-domain.com
# ─────────────────────────────────────────────────────────────────────

# Rate limiting zone — prevent abuse
limit_req_zone $binary_remote_addr zone=artemis_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=artemis_chat:10m rate=5r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=artemis_conn:10m;

upstream artemis_backend {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Change to your domain when deploying with DNS
    server_name _;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Logging ───────────────────────────────────────────────────
    access_log /var/log/nginx/artemis-access.log;
    error_log  /var/log/nginx/artemis-error.log warn;

    # ── Limits ────────────────────────────────────────────────────
    client_max_body_size 10m;
    limit_conn artemis_conn 20;

    # ── Health check (no rate limit) ──────────────────────────────
    location /health {
        proxy_pass http://artemis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ── Chat endpoints — longer timeouts (tool-calling loop) ──────
    location /api/chat {
        limit_req zone=artemis_chat burst=10 nodelay;

        proxy_pass http://artemis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;    # 5 min — tool-calling loops can be long
        proxy_send_timeout 60s;
        proxy_buffering off;        # Streaming support
    }

    # ── SSE Events endpoint ───────────────────────────────────────
    location /api/events {
        proxy_pass http://artemis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;    # SSE can be open for a while
    }

    # ── General API ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=artemis_api burst=50 nodelay;

        proxy_pass http://artemis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # ── Dashboard (root page) ────────────────────────────────────
    location / {
        proxy_pass http://artemis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
