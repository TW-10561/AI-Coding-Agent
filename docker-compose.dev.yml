# ── Thirdwave AI — Development Docker Compose ───────────────────────────
#
# Quick start:
#   cp platform/.env .env.dev        (edit gateway URL/keys as needed)
#   docker compose -f docker-compose.dev.yml up --build
#
# This spins up the platform server for development.
# The VS Code extension connects to it at http://localhost:3100.

services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: thirdwave-dev
    ports:
      - "${PORT:-3100}:3100"
      - "${OPENCODE_PORT:-4096}:4096"
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"
      NODE_ENV: development
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      OPENCODE_URL: "http://127.0.0.1:4096"
      OPENCODE_BIN: opencode
      OPENCODE_DIR: /workspace
      AGENT_WORKSPACE_DIR: /workspace/.agent-workspace
      # Gateway — update these to match your inference setup
      VLLM_GATEWAY_URL: "${VLLM_GATEWAY_URL:-http://172.30.140.63:9080/v1}"
      VLLM_GATEWAY_KEY: "${VLLM_GATEWAY_KEY:-}"
      # Cloud provider keys (optional)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_AI_API_KEY: "${GOOGLE_AI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    volumes:
      # Mount project source for live reload
      - ./platform/src:/app/platform/src:ro
      - ./platform/scripts:/app/platform/scripts:ro
      - ./platform/HITL:/app/platform/HITL:ro
      - ./platform/util:/app/platform/util:ro
      - ./platform/tui:/app/platform/tui:ro
      - ./platform/skills:/app/platform/skills:rw
      # Workspace for agent file operations
      - workspace-data:/workspace
      # Persist OpenCode state across restarts
      - opencode-state:/root/.local/share/opencode
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 60s

volumes:
  workspace-data:
  opencode-state:
