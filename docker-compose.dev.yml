# ── Thirdwave AI — Development Docker Compose ───────────────────────────
#
# Quick start:
#   cp platform/.env .env.dev        (edit gateway URL/keys as needed)
#   docker compose -f docker-compose.dev.yml up --build
#
# This spins up the platform server for development.
# The VS Code extension connects to it at http://localhost:3100.

services:
  # ── PostgreSQL (dev) ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: thirdwave-postgres-dev
    environment:
      POSTGRES_DB: thirdwave
      POSTGRES_USER: ${POSTGRES_USER:-thirdwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thirdwave_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./platform/src/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./platform/src/config/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thirdwave}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  platform:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: thirdwave-dev
    ports:
      - "${PORT:-3100}:3100"
    environment:
      PORT: "3100"
      HOST: "0.0.0.0"
      NODE_ENV: development
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      AGENT_WORKSPACE_DIR: /workspace/.agent-workspace
      # Gateway — update these to match your inference setup
      VLLM_GATEWAY_URL: "${VLLM_GATEWAY_URL:-http://172.30.140.63:9080/v1}"
      VLLM_GATEWAY_KEY: "${VLLM_GATEWAY_KEY:-}"
      # Cloud provider keys (optional)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_AI_API_KEY: "${GOOGLE_AI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      # PostgreSQL — direct connection (no PgBouncer in dev)
      POSTGRES_URL: "postgresql://${POSTGRES_USER:-thirdwave}:${POSTGRES_PASSWORD:-thirdwave_dev}@postgres:5432/thirdwave"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-in-production}"
    volumes:
      # Mount project source for live reload
      - ./platform/src:/app/platform/src:ro
      - ./platform/scripts:/app/platform/scripts:ro
      - ./platform/HITL:/app/platform/HITL:ro
      - ./platform/util:/app/platform/util:ro
      - ./platform/tui:/app/platform/tui:ro
      - ./platform/skills:/app/platform/skills:rw
      # Workspace for agent file operations
      - workspace-data:/workspace

    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 60s

volumes:
  workspace-data:
  pgdata-dev:
